<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📚 Biblioteca</h1>

<section>
    <h2>Crear cuenta</h2>

    <form onsubmit="register(event); return false;">
        <input id="nombre" type="text" placeholder="Nombre completo" required>
        <input id="username" type="text" placeholder="Usuario" required>
        <input id="password" type="password" placeholder="Contraseña" required>

        <button type="submit">Registrarse</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="login.html">Volver al login</a></p>
</section>

<script src="app.js"></script>
</body>
</html>
