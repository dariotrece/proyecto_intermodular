<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-icon large">📚</div>
            <h1>Biblioteca</h1>
            <p>Crea tu cuenta de usuario</p>
        </div>

        <section class="auth-section">
            <h2>Crear cuenta</h2>

            <form onsubmit="register(event); return false;" class="auth-form">
                <input id="nombre" type="text" placeholder="Nombre completo" required>
                <input id="username" type="text" placeholder="Usuario" required>
                <input id="password" type="password" placeholder="Contraseña" required>
                <button type="submit">Registrarse</button>
            </form>

            <p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Volver al login</a></p>
        </section>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
