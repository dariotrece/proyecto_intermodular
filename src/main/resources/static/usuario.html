<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuario</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
<h1>Panel Usuario</h1>

<section>
    <h2>Buscar libro por Título</h2>
    <input id="nombreLibro" placeholder="Título Libro">
    <button onclick="buscarLibroTitulo()">Buscar</button>
    <div id="resultadoBusquedaTitulo"></div>
</section>

<section>
    <h2>Valorar libro</h2>

    <input id="tituloValoracion" placeholder="Título del libro">

    <select id="puntuacion">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>

    <select id="origenLibro">
        <option value="BIBLIOTECA">Biblioteca</option>
        <option value="PRIVADO">Libro propio</option>
    </select>

    <textarea id="comentario"></textarea>

    <button onclick="crearValoracion()">Valorar</button>

</section>

<section>
    <h2>Mis valoraciones</h2>
    <div id="listaValoraciones"></div>
    <button onclick="cargarValoraciones()">Carga tus valoraciones haciendo click</button>
</section>

<section>
    <h2>Mis préstamos</h2>
    <div style="display:flex; gap:8px; align-items:center;">
        <button onclick="cargarMisPrestamos(false)">Ver todos</button>
        <button onclick="cargarMisPrestamos(true)">Solo activos</button>
    </div>
    <div id="misPrestamos"></div>
</section>

<section>
    <h2>Buscar valoraciones de otros usuarios</h2>
    <input id="usernameInput" placeholder="Nombre de usuario">
    <button onclick="buscarUsuario()">Buscar</button>
    <div id="valoracionesOtroUsuario"></div>
</section>

<section>
    <h2>Libros mejor valorados</h2>
    <button onclick="cargarRanking()">Ver ranking</button>
    <div id="ranking"></div>
</section>

<section>
    <h2>Reservar libro</h2>
    <input id="reservaTitulo" placeholder="Título del libro">
    <button onclick="crearReserva()">Reservar</button>
</section>

<section>
    <h2>Mis reservas</h2>
    <button onclick="cargarMisReservas()">Ver mis reservas</button>
    <div id="misReservas"></div>
</section>


<script src="app.js"></script>
</body>
</html>
